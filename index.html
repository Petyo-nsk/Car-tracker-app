<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моят автомобил — проследяване</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Моят автомобил">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1c2028; --panel2:#20242d; --line:#2b303a;
  --ink:#edeef0; --muted:#8b93a1; --amber:#e8a33d;
  --green:#4c9a6a; --green-dim:#1c3324;
  --red:#d9634f; --red-dim:#3a1f1b;
  --amberS:#e0a83d; --amberS-dim:#3a2f14;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
h1,.brand{font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:480px; margin:0 auto; padding:20px 18px 48px;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 10px var(--amber);}
.brand span{font-weight:700; font-size:17px;}
.langSwitch{margin-left:auto; display:flex; gap:4px; font-family:'Inter',sans-serif;}
.langSwitch button{background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:4px 10px; font-size:11.5px; font-weight:700;}
.langSwitch button.active{background:var(--panel2); color:var(--ink); border-color:var(--muted);}
.carSwitcher{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.carPill{flex-shrink:0; background:var(--panel); border:1px solid var(--line); border-radius:100px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;}
.carPill.active{background:var(--amber); color:#1a1305; border-color:var(--amber);}
.carPill.addNew{color:var(--amber); border-style:dashed;}
.carcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:14px;}
.carcard h2{margin:0 0 3px; font-size:18px;}
.carcard{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.sosBtn{flex-shrink:0; background:transparent; color:var(--red); border:1px solid var(--red); border-radius:100px; padding:7px 12px; font-size:12.5px; font-weight:700;}
.sosCall{display:block; text-align:center; text-decoration:none; background:var(--red); color:#fff; border-radius:10px; padding:13px; font-weight:700; font-size:15px;}
.sosLoc{width:100%; margin-top:10px; background:var(--panel2); color:var(--ink); border:1px solid var(--line);}
.sosOut{background:var(--panel2); border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; font-size:13px; line-height:1.6;}
.sosOut a{color:var(--amber); font-weight:600; margin-right:12px;}
.sos112{display:block; text-align:center; margin-top:14px; color:var(--red); font-weight:700; font-size:13.5px; text-decoration:none;}
.medalBar{width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin:-4px 0 14px; font-size:13px; font-weight:600;}
.medalBar span:last-child{color:var(--amber);}
.medalGrid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:16px;}
.medal{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center; font-size:10.5px; line-height:1.3; color:var(--muted);}
.medal .mi{font-size:22px; display:block; margin-bottom:3px;}
.medal.got{border-color:var(--amber); color:var(--ink);}
.medal:not(.got) .mi{filter:grayscale(1); opacity:.35;}
.skinTitle{font-size:12.5px; color:var(--muted); margin:4px 0 8px;}
.skinRow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.skinChip{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:100px; padding:7px 12px; font-size:12.5px; font-weight:600;}
.skinChip.on{border-color:var(--amber); color:var(--amber);}
.skinChip.lock{opacity:.5;}
.skinChip .sw{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:-1px;}
.skinNote{font-size:11.5px; color:var(--muted); line-height:1.5;}
.carcard .sub{font-size:12.5px; color:var(--muted);}
.summary{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:flex-start; gap:10px;}
.summary .smain{font-size:14px; font-weight:600; line-height:1.35;}
.summary .ssub{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4;}
.summary .sdot{width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:5px; background:var(--muted);}
.summary.ok{border-color:rgba(76,154,106,0.45);}
.summary.ok .sdot{background:var(--green); box-shadow:0 0 8px var(--green);}
.summary.soon{background:var(--amberS-dim); border-color:var(--amberS);}
.summary.soon .sdot{background:var(--amberS); animation:pulse 1.6s ease-in-out infinite;}
.summary.over{background:var(--red-dim); border-color:var(--red);}
.summary.over .sdot{background:var(--red); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.5); opacity:.55;}}
@media (prefers-reduced-motion: reduce){ .summary .sdot{animation:none !important;} }
/* Колата-талисман — настроението следва лентата със статуса */
.summary.withMascot{align-items:center; gap:12px;}
.mascot{width:72px; height:60px; flex-shrink:0; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.mascot.poke{animation:mPoke .45s ease-out;}
@keyframes mPoke{0%{transform:scale(1);} 30%{transform:scale(.88) rotate(-4deg);} 65%{transform:scale(1.08) rotate(3deg);} 100%{transform:scale(1);}}
.mascot svg{width:100%; height:100%; overflow:visible;}
.mascot.happy svg{animation:mBounce 2.6s ease-in-out infinite;}
.mascot.worried svg{animation:mShake 3s ease-in-out infinite;}
.mascot.sad svg{transform:translateY(2px);}
.mascot.sleepy svg{animation:mBreathe 4s ease-in-out infinite;}
.mascot .lid{transform-box:fill-box; transform-origin:center top; transform:scaleY(0); animation:mBlink 4.5s infinite;}
.mascot .drop{animation:mDrop 2.4s ease-in infinite;}
.mascot .zz{animation:mZz 3s ease-in-out infinite;}
@keyframes mBounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
@keyframes mShake{0%,86%,100%{transform:rotate(0);} 89%{transform:rotate(-3deg);} 93%{transform:rotate(3deg);} 96%{transform:rotate(-2deg);}}
@keyframes mBreathe{0%,100%{transform:scale(1);} 50%{transform:scale(1.025);}}
@keyframes mBlink{0%,92%,100%{transform:scaleY(0);} 95%{transform:scaleY(1);}}
@keyframes mDrop{0%{opacity:0; transform:translateY(-2px);} 25%{opacity:1;} 100%{opacity:0; transform:translateY(8px);}}
@keyframes mZz{0%,100%{opacity:.3; transform:translate(0,0);} 50%{opacity:1; transform:translate(2px,-3px);}}
@media (prefers-reduced-motion: reduce){ .mascot, .mascot svg, .mascot .lid, .mascot .drop, .mascot .zz{animation:none !important;} }
.item{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
.locked{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; opacity:0.45; position:relative;}
.locked .item-title{font-weight:600; font-size:14.5px;}
.locked .item-detail{font-size:12.5px; color:var(--muted); margin-top:6px;}
.lockIcon{position:absolute; top:14px; right:16px; font-size:15px;}
.unlockCard{background:linear-gradient(135deg,#2a2210,#1c2028); border:1px solid var(--amber); border-radius:16px; padding:18px; margin:6px 0 18px; text-align:center;}
.premiumBanner{background:rgba(76,154,106,0.12); border:1px solid var(--green); border-radius:12px; padding:9px 14px; margin:0 0 14px; font-size:12.5px; color:var(--green); text-align:center;}
.unlockTitle{font-weight:700; font-size:15px; margin-bottom:3px;}
.unlockSub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
.unlockBtn{background:var(--amber); color:#1a1305; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:14.5px; cursor:pointer; width:100%;}
.promoRow{display:flex; gap:8px; margin-bottom:10px;}
.promoRow input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 10px; color:var(--ink); font-size:13px;}
.applyPromo{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:0 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
.promoMsg{font-size:12px; margin-bottom:10px; min-height:14px;}
.promoMsg.ok{color:var(--green);}
.promoMsg.bad{color:var(--red);}
.adminLink{text-align:center; margin-top:22px; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.adminPanel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px;}
.adminPanel h4{margin:0 0 12px; font-size:14px;}
.genRow{display:flex; gap:8px; margin-bottom:14px;}
.genRow input{flex:1;}
.genRow select{width:110px;}
.genBtn{background:var(--amber); color:#1a1305; font-size:12.5px; padding:0 14px; border-radius:9px; font-weight:700; cursor:pointer; border:none;}
.codeRow{display:flex; justify-content:space-between; align-items:center; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; font-size:12.5px;}
.codeRow .code{font-weight:700; letter-spacing:0.5px;}
.codeRow .meta{color:var(--muted);}
.ownerNote{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
.brokerMsg{text-align:center; font-size:12.5px; color:var(--green); margin-top:6px; min-height:14px;}
.item-top{display:flex; justify-content:space-between; align-items:center;}
.item-title{font-weight:600; font-size:14.5px;}
.status{font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px;}
.status.ok{background:var(--green-dim); color:var(--green);}
.status.soon{background:var(--amberS-dim); color:var(--amberS);}
.status.over{background:var(--red-dim); color:var(--red);}
.status.info{background:var(--panel2); color:var(--muted); border:1px solid var(--line);}
.item-detail{font-size:12.5px; color:var(--muted); margin-top:6px;}
.overlay{position:fixed; inset:0; background:rgba(10,11,14,0.6); display:none; align-items:flex-end; justify-content:center; z-index:10;}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); width:100%; max-width:480px;}
.sheet h3{margin:0 0 14px; font-size:16px;}
label{font-size:12.5px; color:var(--muted); display:block; margin:10px 0 5px;}
label:first-of-type{margin-top:0;}
input,select{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px 11px; color:var(--ink); font-size:14px; font-family:inherit;}
input:focus,select:focus{outline:none; border-color:var(--amber);}
.calcExpiry{background:var(--panel2); border:1px dashed var(--line); border-radius:9px; padding:10px 11px; font-size:14px; font-weight:600; color:var(--amber);}
.row2{display:flex; gap:10px;}
.row2>div{flex:1;}
.btnrow{display:flex; gap:10px; margin-top:16px;}
button{border:none; border-radius:10px; padding:12px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
.save{flex:1; background:var(--amber); color:#1a1305;}
.cancel{flex:1; background:var(--panel2); color:var(--ink); border:1px solid var(--line);}
.emptyState{background:var(--panel); border:1px dashed var(--line); border-radius:16px; padding:28px 20px; text-align:center;}
.emptyState .big{font-size:32px; margin-bottom:10px;}
.emptyState p{color:var(--muted); font-size:13.5px; margin:0 0 16px;}
.renewBtn{display:inline-block; margin-top:10px; background:transparent; color:var(--amber); border:1px solid var(--amber); border-radius:100px; padding:7px 14px; font-size:12.5px; font-weight:700;}
.renewBtn.hot{background:var(--amber); color:#1a1305;}
.partsRow{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.partsBtn{background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:100px; padding:6px 12px; font-size:12px; font-weight:600;}
.partsBtn.premium{border-color:var(--amber); color:var(--amber);}
.partsDisc{font-size:12px; color:var(--amber); margin-top:6px;}
.partsNote{font-size:10.5px; color:var(--muted); margin-top:5px;}
.partsInSheet{margin-top:6px;}
.fuelHint{font-size:11.5px; color:var(--muted); margin-top:8px;}
.fuelList{margin-top:12px;}
.fuelRow{display:flex; justify-content:space-between; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; margin-top:6px; font-size:12.5px;}
.fuelRow a{color:var(--muted); text-decoration:underline; cursor:pointer; flex-shrink:0;}
.taxPay{margin-top:14px;}
.taxEpay{display:block; text-align:center; text-decoration:none; padding:12px; border-radius:10px; font-weight:700; font-size:14.5px;}
.summary .renewBtn{margin-top:8px;}
.renewText{font-size:13.5px; line-height:1.5; margin:0 0 12px;}
.renewExpiry{font-size:13px; color:var(--muted); margin:-6px 0 12px;}
.renewGo{width:100%; background:var(--amber); color:#1a1305;}
.renewNote{font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:12px;}
.toast{position:fixed; left:16px; right:16px; bottom:24px; z-index:50; background:var(--panel2); color:var(--ink); border:1px solid var(--green); border-radius:12px; padding:12px 16px; font-size:13.5px; font-weight:600; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.35);}
.renewLink{display:block; text-align:center; margin-top:12px; font-size:12.5px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.demoTag{position:fixed; bottom:calc(8px + env(safe-area-inset-bottom,0px)); right:8px; background:var(--amber); color:#1a1305; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:100px; z-index:20;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot"></div><span id="brandName">Моят автомобил</span><div class="langSwitch" id="langSwitch"></div></div>

  <div class="carSwitcher" id="carSwitcher"></div>

  <div id="mainArea"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="sheetTitle">Редакция</h3>
    <div id="sheetFields"></div>
    <div class="btnrow">
      <button class="cancel" id="cancelBtn" type="button" data-t="cancel">Отказ</button>
      <button class="save" id="saveBtn" type="button" data-t="save">Запази</button>
    </div>
  </div>
</div>

<div class="overlay" id="renewOverlay">
  <div class="sheet">
    <h3 id="renewTitle">Поднови</h3>
    <div id="renewBody"></div>
  </div>
</div>

<script>
// ==== Език: BG (по подразбиране) или EN. Всеки текст е tr('български', 'English'). ====
// Смяната на езика презарежда страницата, за да се построят наново всички текстове.
const LANG_KEY = 'car-tracker-lang-v1';
const LANGS = ['bg', 'en'];
let LANG = 'bg';
try{ const s = localStorage.getItem(LANG_KEY); if(LANGS.includes(s)) LANG = s; }catch(e){}
document.documentElement.lang = LANG;
function tr(bg, en){ return LANG === 'en' ? en : bg; }
function setLang(l){ try{ localStorage.setItem(LANG_KEY, l); }catch(e){} location.reload(); }

// Днешната дата (без час), в същия вид като датите от полетата — 'ГГГГ-ММ-ДД' в полунощ UTC,
// за да излиза точно броят на дните до изтичане.
const now = new Date();
const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
const CARS_KEY = 'car-tracker-cars-v1';
const ACTIVE_KEY = 'car-tracker-active-v1';
const DATA_PREFIX = 'car-tracker-data-';

const defs = [
  {id:'oil', title:tr('Смяна на масло','Oil change'), mode:'km', fields:['date','km','nextKm'], premium:false,
   labels:{date:tr('Дата','Date'),km:tr('Пробег при смяна (км)','Mileage at change (km)'),nextKm:tr('Следваща смяна (км)','Next change (km)')}},
  {id:'tires', title:tr('Смяна на гуми','Tire change'), mode:'date_soft', fields:['date','note'], premium:false,
   labels:{date:tr('Дата','Date'),note:tr('Бележка (напр. зимни / летни)','Note (e.g. winter / summer)')}},
  // Дневник на зарежданията: списък от записи (дата, литри, сума, километраж) → среден разход и разход за месеца
  {id:'fuel', title:tr('Зареждания','Refuelling'), mode:'fuel', fields:[], premium:false, labels:{}},
  {id:'chain', title:tr('Верига (смазване / смяна)','Chain (lube / replace)'), mode:'km', fields:['date','km','nextKm'], premium:false, only:'moto',
   labels:{date:tr('Дата','Date'),km:tr('Пробег при обслужване (км)','Mileage at service (km)'),nextKm:tr('Следващо обслужване (км)','Next service (km)')}},
  {id:'civil', title:tr('Гражданска отговорност','Liability insurance (MTPL)'), mode:'date_period', fields:['date','period'], premium:true,
   labels:{date:tr('Дата на плащане','Payment date'),period:tr('Период','Period')}},
  // Мотоциклетите в България не плащат е-винетка (bgtoll.bg) — затова само за коли
  {id:'vignette', title:tr('Винетка','Vignette'), mode:'vignette', fields:['vtype','date'], premium:true, only:'car',
   labels:{vtype:tr('Вид','Type'),date:tr('Начало на валидност','Valid from')}},
  {id:'inspection', title:tr('Годишен технически преглед','Annual technical inspection'), mode:'date', fields:['date','expiry'], premium:true,
   labels:{date:tr('Дата на преглед','Inspection date'),expiry:tr('Изтича на','Expires on')}},
  {id:'casco', title:tr('Каско','Casco (comprehensive)'), mode:'date', fields:['date','expiry'], premium:true,
   labels:{date:tr('Дата на плащане','Payment date'),expiry:tr('Изтича на','Expires on')}},
  // Данък МПС: сроковете са по закон (ЗМДТ, чл. 60) и са едни и същи за всички — човекът само отбелязва какво е платил
  {id:'tax', title:tr('Данък МПС','Vehicle tax'), mode:'tax', fields:['status'], premium:true,
   labels:{status:tr('Платено за','Paid for')}}
];
// Вид превозно средство: 'car' (по подразбиране — и за старите записи без вид) или 'moto'
const VEHICLE_TYPES = {car:{label:tr('Кола','Car'), icon:'🚗'}, moto:{label:tr('Мотор','Motorcycle'), icon:'🏍️'}};
function vehicleType(car){ return car && car.type === 'moto' ? 'moto' : 'car'; }
// Данък МПС е готов, но изключен по решение на Петьо (03.10.2026). За да се появи картата и медалът: TAX_ENABLED = true.
const TAX_ENABLED = false;
// Бутонът „Авария“ е скрит временно, за да видим как изглежда без него (04.10.2026). Връща се с SOS_ENABLED = true.
const SOS_ENABLED = false;
function defsFor(car){ const t = vehicleType(car); return defs.filter(d=>(!d.only || d.only===t) && (d.id !== 'tax' || TAX_ENABLED)); }
// Сезонна бележка за мотора: пролетта — проверка преди сезона, зимата — акумулаторът
function motoSeasonTip(){
  const m = now.getMonth() + 1;
  if(m >= 3 && m <= 4) return tr('Пролетта идва 🏍️ Провери акумулатора, веригата, гумите и ГО преди сезона.', 'Spring is coming 🏍️ Check the battery, chain, tires and insurance before the season.');
  if(m >= 11 || m <= 2) return tr('Зимата 🔋 Зареждай акумулатора веднъж месечно, за да те чака готов напролет.', 'Winter 🔋 Charge the battery once a month so it is ready in spring.');
  return '';
}

// ==== Бутон „Поднови“ към партньор ====

// Личният код на собственика вече НЕ стои тук — той живее само в базата данни (Supabase),
// точно като партньорските кодове, за да не може никой да го прочете в изходния код на страницата.
// Локалната формула по-долу е РЕЗЕРВЕН вариант (работи offline), докато Supabase не е
// настроен — кодовете, генерирани от него, НЕ са истински еднократни. След настройка на
// Supabase, реалните партньорски кодове идват от базата и минават през redeemCodeRemote.
const CODE_SALT = 'MyAuto2026Secret';
function codeChecksum(base, months){
  const s = base + '|' + months + '|' + CODE_SALT;
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h.toString(36).toUpperCase().padStart(5,'0').slice(0,5);
}
function validatePromoCodeLocal(code){
  const parts = code.split('-');
  if(parts.length < 3) return null;
  const checksumPart = parts.pop();
  const monthsPart = parts.pop();
  const base = parts.join('-');
  const m = /^(\d+)M$/.exec(monthsPart);
  if(!m) return null;
  const months = parseInt(m[1],10);
  if(codeChecksum(base, months) !== checksumPart) return null;
  return {base, months};
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  return Math.round((d - today) / 86400000);
}
// Показва датата по българския начин: '2026-01-15' → '15.01.2026'. Вътрешно пазим 'ГГГГ-ММ-ДД'.
function fmtDate(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (dateStr || '');
}
// ==== Винетка: видът определя колко важи. Пазим последния валиден ден (по-скоро рано, отколкото късно). ====
const VIGNETTE_TYPES = {
  day:     tr('Еднодневна', 'One day'),
  weekend: tr('Уикенд', 'Weekend'),
  week:    tr('Седмична', 'Weekly'),
  month:   tr('Месечна', 'Monthly'),
  quarter: tr('Тримесечна', 'Quarterly'),
  year:    tr('Годишна', 'Annual')
};
function addDays(dateStr, n){
  const d = new Date(dateStr);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function vignetteExpiry(start, vtype){
  if(!start) return null;
  switch(vtype){
    case 'day':     return start;
    case 'weekend': return addDays(start, (7 - new Date(start).getUTCDay()) % 7); // до неделята включително
    case 'week':    return addDays(start, 6);
    case 'month':   return addDays(addMonths(start, 1), -1);
    case 'quarter': return addDays(start, 89);                                   // 90 дни
    default:        return addDays(addMonths(start, 12), -1);                    // годишна
  }
}
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + parseInt(months,10));
  return d.toISOString().slice(0,10);
}

// Данък МПС: целият до 30.04 с 5% отстъпка, или на две вноски — до 30.06 и до 31.10.
// Пазим {status:'', 'first' или 'full', year}; от нова година всичко започва отначало.
function taxState(rec){
  const y = today.getUTCFullYear();
  const known = !!(rec && String(rec.year) === String(y));
  const paid = known ? (rec.status || '') : '';
  const d = md => `${y}-${md}`;
  const t = todayISO();
  // Още не е отбелязал нищо за годината: не знаем дали е платил → никога червено, само напомняне преди срок
  if(!known){
    if(t.slice(5, 7) === '04') return {paid, unknown:true, kind:'discount', next:d('04-30')};
    if(t <= d('06-30')) return {paid, unknown:true, kind:'first', next:d('06-30')};
    if(t <= d('10-31')) return {paid, unknown:true, kind:'second', next:d('10-31')};
    return {paid, unknown:true};
  }
  if(paid === 'full') return {paid};
  if(paid === 'first') return {paid, kind:'second', next:d('10-31'), overdue: t > d('10-31')};
  if(t.slice(5, 7) === '04') return {paid, kind:'discount', next:d('04-30')};   // през април напомняме за отстъпката
  if(t <= d('06-30')) return {paid, kind:'first', next:d('06-30')};
  return {paid, kind:'both', next:d('10-31'), overdue:true};                        // 1-вата вноска е пропусната
}

function statusFor(def, data, currentKm){
  const rec = data[def.id];
  if(def.mode==='tax'){
    const st = taxState(rec);
    if(st.paid === 'full') return {cls:'ok', label:tr('Платен','Paid'), tax:st};
    if(st.unknown){
      const dd = st.next ? daysUntil(st.next) : null;
      if(dd !== null && dd <= 15) return {cls:'soon', label:`${tr('До','By')} ${fmtDate(st.next).slice(0, 5)}`, days:dd, expiry:st.next, tax:st};
      return {cls:'soon', label:tr('Отбележи','Mark it'), missing:true, tax:st};
    }
    if(st.overdue) return {cls:'over', label:tr('Просрочен','Overdue'), days:-1, expiry:st.next, tax:st};
    const d = daysUntil(st.next);
    const cls = d<=7 && st.kind!=='discount' ? 'over' : (d<=15 ? 'soon' : 'ok');
    return {cls, label:`${tr('До','By')} ${fmtDate(st.next).slice(0, 5)}`, days:d, expiry:st.next, tax:st};
  }
  // missing — няма попълнени данни (не значи, че нещо наближава)
  // days / expiry — ползват се от лентата със статуса най-горе
  // Маслото и гумите са дневник: приложението не знае реалния пробег, затова са без цвят/срок.
  if(def.mode==='fuel'){
    return fuelList(data).length ? {cls:'info', label:tr('Записано','Logged')} : {cls:'info', label:tr('Няма запис','No entry'), missing:true};
  }
  if(def.mode==='km' || def.mode==='date_soft'){
    return (rec && rec.date) ? {cls:'info', label:tr('Записано','Logged')} : {cls:'info', label:tr('Няма запис','No entry'), missing:true};
  }
  if(!rec || !rec.date) return {cls:'soon', label:tr('Няма данни','No data'), missing:true};
  if(def.mode==='date_period'){
    if(!rec.period) return {cls:'soon', label:tr('Няма период','No period'), missing:true};
    const expiry = addMonths(rec.date, rec.period);
    const d = daysUntil(expiry);
    if(d<=7) return {cls:'over', label: d<0 ? tr('Изтекла','Expired') : daysLabel(d), days:d, expiry};
    if(d<=15) return {cls:'soon', label:daysLabel(d), days:d, expiry};
    return {cls:'ok', label:tr('Валидна','Valid'), days:d, expiry};
  }
  if(def.mode==='vignette'){
    const expiry = vignetteExpiry(rec.date, rec.vtype);
    const d = daysUntil(expiry);
    if(d<=7) return {cls:'over', label: d<0 ? tr('Изтекла','Expired') : (d===0 ? tr('Днес','Today') : daysLabel(d)), days:d, expiry};
    if(d<=15) return {cls:'soon', label:daysLabel(d), days:d, expiry};
    return {cls:'ok', label:tr('Валидна','Valid'), days:d, expiry};
  }
  if(def.mode==='date'){
    const d = daysUntil(rec.expiry);
    if(d===null) return {cls:'soon', label:tr('Няма дата','No date'), missing:true};
    if(d<=7) return {cls:'over', label: d<0 ? tr('Изтекъл','Expired') : daysLabel(d), days:d, expiry:rec.expiry};
    if(d<=15) return {cls:'soon', label:daysLabel(d), days:d, expiry:rec.expiry};
    return {cls:'ok', label:tr('Валиден','Valid'), days:d, expiry:rec.expiry};
  }
  return {cls:'info', label:tr('Записано','Logged')};
}

const dayNumber = Math.floor(today / 86400000);
function fillLine(line, x){ return line.replace('{x}', x || ''); }
function mascotLine(mood, x){
  const lines = MASCOT_LINES[mood] || MASCOT_LINES.happy;
  return fillLine(lines[dayNumber % lines.length], x);
}

function whenText(s){
  if(s.days < 0) return tr(`изтече преди ${-s.days} ${-s.days===1 ? 'ден' : 'дни'}`, `expired ${-s.days} ${-s.days===1 ? 'day' : 'days'} ago`);
  if(s.days === 0) return tr('изтича днес', 'expires today');
  if(s.days === 1) return tr('изтича утре', 'expires tomorrow');
  return tr(`изтича след ${s.days} дни`, `expires in ${s.days} days`);
}
function phrase(e){
  if(e.def.id === 'tax') return taxPhrase(e.s);
  return `${SHORT_NAMES[e.def.id] || e.def.title} ${whenText(e.s)}`;
}
function taxPhrase(s){
  const st = s.tax || {};
  const inDays = s.days === 0 ? tr('днес', 'today') : tr(`след ${s.days} дни`, `in ${s.days} days`);
  if(st.kind === 'both') return tr('1-вата вноска за данъка е просрочена', 'The 1st vehicle tax instalment is overdue');
  if(st.overdue) return tr('данъкът за годината е просрочен', 'this year\'s vehicle tax is overdue');
  if(st.kind === 'discount') return tr(`целият данък с 5% отстъпка е до 30.04 (${inDays})`, `the full vehicle tax with a 5% discount is due by 30.04 (${inDays})`);
  if(st.kind === 'first') return tr(`1-вата вноска за данъка е до 30.06 (${inDays})`, `the 1st vehicle tax instalment is due by 30.06 (${inDays})`);
  return tr(`2-рата вноска за данъка е до 31.10 (${inDays})`, `the 2nd vehicle tax instalment is due by 31.10 (${inDays})`);
}

function buildSummary(defsList, data, km, type){
  const docs = defsList.filter(def=>SUMMARY_IDS.includes(def.id));
  const taxName = TAX_ENABLED ? tr(' и данък', ' and tax') : '';
  const docNames = (type === 'moto' ? tr('гражданска, преглед и каско', 'liability insurance, inspection and casco') : tr('гражданска, винетка, преглед и каско', 'liability insurance, vignette, inspection and casco')) + taxName;
  if(!docs.length){
    // Безплатна версия — документите са заключени
    return {cls:'ok', main:mascotLine('happy'), sub:tr(`Следи ${docNames} с премиум — ще ти казваме кога изтичат.`, `Track ${docNames} with premium — we will tell you when they expire.`)};
  }
  const entries = docs.map(def=>({def, s:statusFor(def, data, km)}));
  const tracked = entries.filter(e=>!e.s.missing && e.s.days !== undefined).sort((a,b)=>a.s.days-b.s.days);
  const over = tracked.filter(e=>e.s.cls==='over');
  const soon = tracked.filter(e=>e.s.cls==='soon');
  const missing = entries.filter(e=>e.s.missing).map(e=>SHORT_NAMES[e.def.id] || e.def.title);

  if(!tracked.length){
    return {cls:'none', main:mascotLine('sleepy'), sub:tr(`Въведи датите за ${docNames} — ще ти казваме кога наближават.`, `Enter the dates for ${docNames} — we will tell you when they are coming up.`)};
  }
  if(over.length || soon.length){
    const urgent = [...over, ...soon];
    const rest = urgent.slice(1).map(phrase).join(' · ');
    const first = phrase(urgent[0]);
    const x = first.charAt(0).toLowerCase() + first.slice(1);   // в средата на изречението
    return {cls: over.length ? 'over' : 'soon', main:mascotLine(over.length ? 'sad' : 'worried', x), x,
      sub: rest ? `${tr('Също','Also')}: ${rest}` : tr('Натисни реда отдолу, за да го обновиш.', 'Tap the row below to update it.'),
      renewId: RENEW_LABELS[urgent[0].def.id] ? urgent[0].def.id : null, taxPay: urgent[0].def.id === 'tax'};
  }
  const next = tracked[0];
  const when = tr(`${SHORT_NAMES[next.def.id]} на ${fmtDate(next.s.expiry)} (след ${next.s.days} дни)`, `${SHORT_NAMES[next.def.id]} on ${fmtDate(next.s.expiry)} (in ${next.s.days} days)`);
  let sub = `${tr('Следва','Next')}: ${when}`;
  if(missing.length) sub += ` · ${tr('Попълни','Fill in')}: ${missing.join(', ').toLowerCase()}`;
  if(type === 'moto' && motoSeasonTip()) sub += `<br>${motoSeasonTip()}`;
  return {cls:'ok', main:mascotLine('happy'), sub};
}

function detailFor(def, data){
  const rec = data[def.id];
  if(def.mode==='tax'){
    const st = taxState(rec), y = today.getUTCFullYear();
    if(st.paid === 'full') return tr(`Платен за ${y} ✓`, `Paid for ${y} ✓`);
    if(st.paid === 'first') return tr('1-вата вноска е платена · 2-рата до 31.10', '1st instalment paid · 2nd due by 31.10');
    if(st.unknown) return tr('Отбележи какво си платил тази година — ще ти напомняме за сроковете', 'Mark what you paid this year — we will remind you of the deadlines');
    return tr('Целият до 30.04 с 5% отстъпка · или на две вноски: 30.06 и 31.10', 'Full by 30.04 with 5% off · or two instalments: 30.06 and 31.10');
  }
  if(def.mode==='fuel'){
    const st = fuelStats(data);
    if(!st.last) return tr('Записвай зарежданията — ще видиш разхода си', 'Log your refuels to see your consumption');
    const parts = [`${tr('Последно','Last')}: ${fmtDate(st.last.date)} · ${num1(st.last.liters)} ${tr('л','L')}${st.last.cost ? ' · ' + money(st.last.cost) : ''}`];
    if(st.avg) parts.push(`${tr('среден разход','average')} ${num1(st.avg)} ${tr('л/100 км','L/100 km')}`);
    if(st.month) parts.push(`${tr('този месец','this month')} ${money(st.month)}`);
    return parts.join(' · ');
  }
  if(!rec || !rec.date) return tr('Няма въведени данни', 'No data entered');
  if(def.mode==='date_period'){
    if(!rec.period) return fmtDate(rec.date);
    return `${fmtDate(rec.date)} · ${rec.period} ${tr('мес.','mo.')} → ${tr('изтича','expires')} ${fmtDate(addMonths(rec.date, rec.period))}`;
  }
  if(def.mode==='vignette'){
    return `${VIGNETTE_TYPES[rec.vtype] || VIGNETTE_TYPES.year} · ${tr('от','from')} ${fmtDate(rec.date)} → ${tr('изтича','expires')} ${fmtDate(vignetteExpiry(rec.date, rec.vtype))}`;
  }
  if(def.mode==='date') return `${fmtDate(rec.date)}${rec.expiry ? ` → ${tr('изтича','expires')} ` + fmtDate(rec.expiry) : ''}`;
  const fmtKm = v => v ? (parseInt(v,10)||0).toLocaleString(tr('bg-BG','en-GB')) + tr(' км',' km') : '';
  if(def.mode==='km'){
    const at = rec.km ? ` ${tr('при','at')} ${fmtKm(rec.km)}` : '';
    const next = rec.nextKm ? ` · ${tr('следваща при','next at')} ${fmtKm(rec.nextKm)}` : '';
    return `${tr('Сменено на','Done on')} ${fmtDate(rec.date)}${at}${next}`;
  }
  return `${tr('Сменени на','Changed on')} ${fmtDate(rec.date)}${rec.note ? ' · '+rec.note : ''}`;
}

  const carLimit = isPremium ? MAX_CARS_PREMIUM : 1;

  const addPill = canAdd
    ? `<div class="carPill addNew" id="addCarPill">+ ${tr('Добави','Add')}</div>`
    : `<div class="carPill addNew" id="addCarPill" style="opacity:0.5;">🔒 + ${tr('Добави','Add')}</div>`;
  box.innerHTML = pills + addPill;
  box.querySelectorAll('.carPill[data-id]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeId = el.dataset.id; saveActive(); renderAll(); });

function readJson(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) || fallback; }catch(e){ return fallback; } }

function recordRenewal(id, oldRec, via){
  const old = statusFor(defs.find(d=>d.id===id), {[id]: oldRec || {}});
  const list = readJson(RENEWALS_KEY, []);
  list.push({id, at: todayISO(), daysLeft: (old.days === undefined ? null : old.days), via});
  writeJson(RENEWALS_KEY, list);
}

// Проверява кои медали са спечелени; връща новите (за съобщението „Нов медал“)
function evaluateMedals(state){
  const got = getMedals();
  const renewals = readJson(RENEWALS_KEY, []);
  const onTime = renewals.filter(r=>r.daysLeft !== null && r.daysLeft >= 0);
  const earned = {
    setup: state.setup,
    allgood: state.allgood,
    ontime: onTime.length >= 1,
    early: onTime.some(r=>r.daysLeft >= 7),
    partner: renewals.some(r=>r.via === 'partner'),
    streak3: onTime.length >= 3,
    moto: cars.some(c=>vehicleType(c) === 'moto'),
    fleet: cars.length >= 2,
    taxes: state.taxEarly
  };
  const fresh = MEDALS.filter(m=>earned[m.id] && !got[m.id]);
  if(fresh.length){ fresh.forEach(m=>{ got[m.id] = todayISO(); }); writeJson(MEDALS_KEY, got); }
  return fresh;
}

function skinUnlocked(item){
  if(item.premium) return hasFullAccess();
  if(item.medal) return !!getMedals()[item.medal];
  return true;
}
// Избраното облекло, но само ако още е отключено (напр. премиумът е изтекъл → обратно към основното)
function effectiveSkin(){
  const s = readJson(SKIN_KEY, {});
  const acc = SKIN_ACCESSORIES.find(a=>a.id===s.acc);
  const col = SKIN_COLORS.find(c=>c.id===s.color);
  return {acc: acc && skinUnlocked(acc) ? acc.id : 'none', color: col && skinUnlocked(col) ? col.id : 'amber'};
}
function lockText(item){
  if(item.premium) return tr('Премиум', 'Premium');
  const m = MEDALS.find(x=>x.id===item.medal);
  return m ? `${tr('Медал','Medal')}: ${m.name}` : '';

// ==== Дневник на зарежданията ====
// Пази се в data.fuel.list. Средният разход се смята между първото и последното зареждане с километраж
// (приемаме пълен резервоар): литрите след първото / изминатите км × 100.
function fuelList(data){ return ((data.fuel && data.fuel.list) || []).slice().sort((a, b)=>a.date < b.date ? -1 : a.date > b.date ? 1 : (a.km || 0) - (b.km || 0)); }
function fuelStats(data){
  const list = fuelList(data);
  if(!list.length) return {};
  const withKm = list.filter(e=>e.km > 0);
  let avg = null;
  if(withKm.length >= 2){
    const dist = withKm[withKm.length - 1].km - withKm[0].km;
    const liters = withKm.slice(1).reduce((s, e)=>s + e.liters, 0);
    if(dist > 0 && liters > 0) avg = liters / dist * 100;
  }
  const ym = todayISO().slice(0, 7);
  const month = list.filter(e=>e.date.slice(0, 7) === ym).reduce((s, e)=>s + (e.cost || 0), 0);
  return {last: list[list.length - 1], avg, month, count: list.length};
}
function num1(v){ return (Math.round(v * 10) / 10).toLocaleString(tr('bg-BG','en-GB')); }
function money(v){ return (Math.round(v * 100) / 100).toLocaleString(tr('bg-BG','en-GB'), {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'; }

  document.getElementById('sheetTitle').textContent = tr('Ново зареждане', 'New refuel');
  document.getElementById('sheetFields').innerHTML = `
    <label>${tr('Дата','Date')}</label><input data-f="date" type="date" value="${todayISO()}">
    <div class="row2">

function openSheet(id, carId){

    if(f==='period'){
      const opts = [3,6,12].map(m=>`<option value="${m}" ${String(rec.period||12)===String(m)?'selected':''}>${m} ${tr('месеца','months')}</option>`).join('');
      return `<label>${def.labels[f]}</label><select data-f="period">${opts}</select>
        <label>${tr('Изтича на','Expires on')}</label><div class="calcExpiry" id="calcExpiry">—</div>`;
    }
    if(f==='status'){
      const st = taxState(rec).paid;
      const opts = [['', tr('Още нищо не съм платил','Nothing paid yet')], ['first', tr('1-вата вноска','1st instalment')], ['full', tr('Целият данък (или двете вноски)','Full tax (or both instalments)')]]
        .map(([v, l])=>`<option value="${v}" ${st===v?'selected':''}>${l}</option>`).join('');
      return `<label>${def.labels[f]} ${today.getUTCFullYear()}</label><select data-f="status">${opts}</select>${taxPayLinksHtml()}`;
    }
    if(f==='vtype'){
      const cur = rec.vtype || 'year';
      const opts = Object.entries(VIGNETTE_TYPES).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${v}</option>`).join('');
      return `<label>${def.labels[f]}</label><select data-f="vtype">${opts}</select>`;
    }
    const type = (f==='date'||f==='expiry') ? 'date' : (f==='km'||f==='nextKm') ? 'number' : 'text';
    return `<label>${def.labels[f]}</label><input data-f="${f}" type="${type}" value="${rec[f]||''}">`;
  }).join('');
  if(def.mode==='date_period'){
    // Крайната дата се смята сама от датата на плащане + избрания период
    const dateInp = document.querySelector('#sheetFields [data-f="date"]');
    const periodSel = document.querySelector('#sheetFields [data-f="period"]');
    const updateExpiry = ()=>{
      document.getElementById('calcExpiry').textContent = dateInp.value ? fmtDate(addMonths(dateInp.value, periodSel.value)) : tr('— (избери дата на плащане)', '— (pick the payment date)');
    };
    dateInp.addEventListener('input', updateExpiry);
    periodSel.addEventListener('change', updateExpiry);
    updateExpiry();
  }
  if(def.mode==='vignette'){
    // Крайната дата се смята сама от вида и началото на валидност
    document.getElementById('sheetFields').insertAdjacentHTML('beforeend', `<label>${tr('Изтича на','Expires on')}</label><div class="calcExpiry" id="calcExpiry">—</div>`);
    const dateInp = document.querySelector('#sheetFields [data-f="date"]');
    const typeSel = document.querySelector('#sheetFields [data-f="vtype"]');
    const updateExpiry = ()=>{
      document.getElementById('calcExpiry').textContent = dateInp.value ? fmtDate(vignetteExpiry(dateInp.value, typeSel.value)) : tr('— (избери начало на валидност)', '— (pick the start date)');
    };
    dateInp.addEventListener('input', updateExpiry);
    typeSel.addEventListener('change', updateExpiry);
    updateExpiry();
  }
  // Тих линк към магазин вътре в картата — и за премиум: човекът сам го търси, не е реклама
  const offers = partsOffersFor(id, cars.find(c=>c.id===carId));
  if(offers.length){
    document.getElementById('sheetFields').insertAdjacentHTML('beforeend',
      `<div class="partsInSheet">${offers.map(o=>`<a class="renewLink" data-parts="${o.key}">🛒 ${o.label} — ${tr('партньорски магазин','partner shop')}</a>`).join('')}</div>`);

// ==== Магазини за части (афилиейт) ====
// Магазинът се добавя от страницата с паролата (като брокерите) и идва в SERVER_PARTNERS — тогава отиваме
// при него през нашия линк за препращане. PARTS_URLS е за готови афилиейт линкове (AutoTim, Интимпекс,
// eMAG през Profitshare) — те си броят сами с нашия код в линка. Докато няма нито едно, бутонът казва „скоро“.
const PARTS_URLS = {oil: null, tires: null, chain: null, charger: null};
const PARTS_LABELS = {
  oil:     tr('Масло и филтър', 'Oil and filter'),
  tires:   tr('Гуми за сезона', 'Tires for the season'),
  chain:   tr('Верига и спрей', 'Chain and lube'),
  charger: tr('Зарядно за акумулатор', 'Battery charger')
};
// Кое предложение към коя карта и кога: гумите — само в сезона на смяна, зарядното — мотор през зимата
function partsOffersFor(defId, car){
  const m = now.getMonth() + 1;
  const tireSeason = [3, 4, 10, 11].includes(m);
  const winter = m >= 11 || m <= 2;
  const keys = {
    oil:   ['oil', ...(vehicleType(car) === 'moto' && winter ? ['charger'] : [])],
    tires: tireSeason ? ['tires'] : [],
    chain: ['chain']
  }[defId] || [];
  return keys.map(key=>({key, label: PARTS_LABELS[key]}));
}
// Код за отстъпка само за премиум потребители — когато магазинът ни даде такъв (напр. {code:'PARKBOOK5', text:'−5%'})
const PARTS_PREMIUM_DISCOUNTS = {oil: null, tires: null, chain: null, charger: null};
function partsHtml(offers){
  const note = tr('Партньорска връзка. PARKBOOK може да получи комисиона.', 'Partner link. PARKBOOK may earn a commission.');
  if(!isPremium){
    return `<div class="partsRow">${offers.map(o=>`<button class="partsBtn" type="button" data-parts="${o.key}">🛒 ${o.label} →</button>`).join('')}</div><div class="partsNote">${note}</div>`;
  }
  const disc = offers.map(o=>PARTS_PREMIUM_DISCOUNTS[o.key] ? `${o.label}: <b>${escapeHtml(PARTS_PREMIUM_DISCOUNTS[o.key].text)}</b> ${tr('с код','with code')} <b>${escapeHtml(PARTS_PREMIUM_DISCOUNTS[o.key].code)}</b>` : '').filter(Boolean);
  return `<div class="partsRow">${offers.map(o=>`<button class="partsBtn premium" type="button" data-parts="${o.key}">⭐ ${tr('Премиум оферта','Premium offer')}: ${o.label} →</button>`).join('')}</div>${disc.length ? `<div class="partsDisc">${disc.join(' · ')}</div>` : ''}<div class="partsNote">${note}</div>`;
}
function openPartsLink(key){
  const partner = SERVER_PARTNERS[key];
  const url = partner ? goUrl(partner, key, newCid()) : PARTS_URLS[key];
  if(!url){ showToast(tr('Скоро: проверени магазини за части направо оттук 🛒', 'Coming soon: trusted parts shops right from here 🛒')); return; }
  window.open(url, '_blank', 'noopener');
}

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const editing = document.getElementById('overlay').dataset.editing;
  const vals = {};
  document.querySelectorAll('#sheetFields input, #sheetFields select').forEach(inp=>{ vals[inp.dataset.f] = inp.value; });

  if(editing==='__newcar'){
    const id = 'car'+Date.now();
    const type = vals.type === 'moto' ? 'moto' : 'car';
    cars.push({id, type, name: vals.name || (type==='moto' ? tr('Нов мотор','New motorcycle') : tr('Нова кола','New car')), km: parseInt(vals.km,10)||0});
    saveCars();
    activeId = id; saveActive();
    renderAll();
  } else {
    const carId = document.getElementById('overlay').dataset.carId;
    const data = getData(carId);
    if(editing === 'fuel'){
      const liters = parseFloat(String(vals.liters).replace(',', '.'));
      if(liters > 0 && /^\d{4}-\d{2}-\d{2}$/.test(vals.date || '')){
        const km = parseInt(vals.km, 10) || 0;
        const entry = {id: Date.now(), date: vals.date, liters, cost: parseFloat(String(vals.cost).replace(',', '.')) || 0, km};
        data.fuel = {list: [...fuelList(data), entry]};
        saveData(carId, data);
        // Километражът от зареждането обновява и текущия пробег на колата
        const car = cars.find(c=>c.id===carId);
        if(car && km > (car.km || 0)){ car.km = km; saveCars(); }
      }
      renderMain();
      document.getElementById('overlay').style.display='none';
      return;
    }
    if(editing === 'tax'){
      vals.year = today.getUTCFullYear();
      // Кога е платен целият данък — за медала „Данъци навреме“ (до 30.04 с отстъпката)
      const before = data.tax && String(data.tax.year) === String(vals.year) ? data.tax : {};
      if(vals.status === 'full') vals.paidAt = before.status === 'full' && before.paidAt ? before.paidAt : todayISO();
    }
    data[editing] = vals;
    saveData(carId, data);
    renderMain();
  }
  document.getElementById('overlay').style.display='none';
});

// ==== Потвърдено плащане → сроковете се обновяват сами ====
// След „Продължи към брокера“ пазим какво е тръгнал да купува. Когато се върне в приложението,
// питаме „Мина ли плащането?“ — при „Да“ новата полица се записва сама, без ръчно въвеждане на дати.
// По-късно: ако брокерът ни връща датата (линк за връщане / сигнал), този въпрос отпада.
const PENDING_KEY = 'car-tracker-renew-pending-v1';
const PENDING_MAX_MS = 7 * 86400000;   // след седмица спираме да питаме
const PENDING_MIN_MS = 15000;          // не питаме, ако се е върнал веднага (не е стигнал до плащане)
const PAID_TITLES = {civil:tr('Купи ли новата гражданска?','Did you buy the new insurance?'), vignette:tr('Купи ли новата винетка?','Did you buy the new vignette?'), casco:tr('Поднови ли каското?','Did you renew your casco?')};
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)) || null; }catch(e){ return null; } }
function setPending(p){ try{ p ? localStorage.setItem(PENDING_KEY, JSON.stringify(p)) : localStorage.removeItem(PENDING_KEY); }catch(e){} }

// Новата полица започва, когато изтича старата (ако още е валидна), иначе от днес.
// Винетката пазим като последен валиден ден, затова новата почва на следващия.
function renewedRecord(id, rec){
  const t = todayISO();
  const old = statusFor(defs.find(d=>d.id===id), {[id]: rec || {}});
  const start = (old.expiry && old.expiry >= t) ? (id==='vignette' ? addDays(old.expiry, 1) : old.expiry) : t;
  if(id==='civil') return {date:start, period: (rec && rec.period) || '12'};
  if(id==='vignette') return {vtype: (rec && rec.vtype) || 'year', date:start};
  return {date:start, expiry:addMonths(start, 12)};   // каско — за година
}

function openPaidConfirm(p){
  const car = cars.find(c=>c.id===p.carId);
  const def = defs.find(d=>d.id===p.id);
  if(!car || !def){ setPending(null); return; }
  const data = getData(car.id);
  const next = renewedRecord(p.id, data[p.id]);
  const nextS = statusFor(def, {[p.id]: next});
  const period = p.id==='civil' ? ` (${next.period} ${tr('мес.','mo.')})` : p.id==='vignette' ? ` (${(VIGNETTE_TYPES[next.vtype]||'').toLowerCase()})` : '';
  document.getElementById('renewTitle').textContent = PAID_TITLES[p.id];
  document.getElementById('renewBody').innerHTML = `
    <p class="renewText">${tr(`Ако плащането при <b>${escapeHtml(p.partner || 'партньора')}</b> е минало, обновяваме сроковете вместо теб`, `If your payment with <b>${escapeHtml(p.partner || 'the partner')}</b> went through, we update the dates for you`)}${cars.length > 1 ? ` ${tr('за','for')} <b>${escapeHtml(car.name)}</b>` : ''}:</p>
    <div class="renewExpiry" style="margin:0 0 14px; color:var(--ink); font-weight:600;">${tr('Нова','New')}: ${fmtDate(next.date)} → ${fmtDate(nextS.expiry)}${period}</div>
    <button class="renewGo" type="button" id="paidYesBtn">✅ ${tr('Да, платих — обнови','Yes, I paid — update')}</button>
    <a class="renewLink" id="paidOtherLink">${tr('Платих, но за друг срок — ще го въведа','I paid for a different term — I will enter it')}</a>
    <a class="renewLink" id="paidLaterLink">${tr('Още не съм платил','Not paid yet')}</a>
    <a class="renewLink" id="paidNoLink">${tr('Не купих','I did not buy')}</a>`;
  const ov = document.getElementById('renewOverlay');
  const close = ()=>{ ov.style.display = 'none'; };
  ov.style.display = 'flex';
  document.getElementById('paidYesBtn').addEventListener('click', ()=>{
    recordRenewal(p.id, data[p.id], 'confirm');
    data[p.id] = next;
    saveData(car.id, data);
    logRenewClick(p.id, 'paid', {name: p.partner});
    setPending(null);
    activeId = car.id; saveActive();
    close(); renderAll();
  });
  document.getElementById('paidOtherLink').addEventListener('click', ()=>{
    logRenewClick(p.id, 'paid', {name: p.partner});
    setPending(null); close(); activeId = car.id; saveActive(); renderAll(); openSheet(p.id, car.id);
  });
  // „Още не“ — питаме пак при следващо отваряне след няколко часа
  document.getElementById('paidLaterLink').addEventListener('click', ()=>{ setPending({...p, snoozeUntil: Date.now() + 6*3600000}); close(); });
  document.getElementById('paidNoLink').addEventListener('click', ()=>{ setPending(null); close(); });
}

// ==== Автоматично, без въпроси: партньорът ни връща клиента след плащане ====
// Адрес за връщане, който даваме на партньора (той попълва стойностите от платената полица):
//   ГО:      https://petyo-nsk.github.io/Car-tracker-app/?renewed=civil&cid={cid}&start=ГГГГ-ММ-ДД&months=12
//   Винетка: ...?renewed=vignette&cid={cid}&start=ГГГГ-ММ-ДД&vtype=year   (day/weekend/week/month/quarter/year)
//   Каско:   ...?renewed=casco&cid={cid}&start=ГГГГ-ММ-ДД&expiry=ГГГГ-ММ-ДД
// cid е номерът, който сме сложили в линка към него — по него знаем за коя кола е.
function applyReturnFromPartner(){
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const id = q.get('renewed');
  if(!id || !RENEW_TEXTS[id]) return;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}   // махаме параметрите — да не се приложи пак при презареждане
  const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const start = q.get('start');
  if(!isDate(start)) return;
  let rec;
  if(id==='civil'){ const m = parseInt(q.get('months'), 10); if(!(m >= 1 && m <= 12)) return; rec = {date:start, period:String(m)}; }
  else if(id==='vignette'){ const v = q.get('vtype'); if(!VIGNETTE_TYPES[v]) return; rec = {vtype:v, date:start}; }
  else { const e = q.get('expiry'); if(!isDate(e)) return; rec = {date:start, expiry:e}; }
  // Коя кола: по cid от линка; ако няма съвпадение, но колата е само една — нея
  const p = getPending();
  const car = (p && p.cid && p.cid === q.get('cid') && cars.find(c=>c.id===p.carId)) || (cars.length === 1 ? cars[0] : null);
  if(!car) return;
  applyRenewal(car, id, rec, (p && p.partner) || 'return');
}
// Записва новата полица без въпроси и казва на човека докога важи
function applyRenewal(car, id, rec, partnerName){
  const data = getData(car.id);
  recordRenewal(id, data[id], 'partner');   // потвърдено от партньора — най-ценният медал
  data[id] = rec;
  saveData(car.id, data);
  logRenewClick(id, 'paid', {name: partnerName});
  setPending(null);
  activeId = car.id; saveActive();
  const s = statusFor(defs.find(d=>d.id===id), {[id]: rec});
  showToast(tr(`✅ Обновено автоматично: ${SHORT_NAMES[id].toLowerCase()} — важи до ${fmtDate(s.expiry)}`, `✅ Updated automatically: ${SHORT_NAMES[id].toLowerCase()} — valid until ${fmtDate(s.expiry)}`));
}

// Сигнал от партньора (postback): ако клиентът не се е върнал през линка, питаме сървъра
// дали партньорът е отчел платена полица с нашия cid (backend/partner-postback.sql).
async function claimPostback(p){
  if(!SUPABASE_CONFIGURED || DEMO_MODE || !p.cid) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/claim_renew_postback`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
      body: JSON.stringify({p_cid: p.cid})
    });
    if(!res.ok) return;
    const row = (await res.json())[0];
    if(!row || row.product !== p.id) return;
    const car = cars.find(c=>c.id===p.carId);
    if(!car) return;
    const rec = row.product==='civil' ? {date:row.start_date, period:String(row.months || 12)}
              : row.product==='vignette' ? {vtype:row.vtype || 'year', date:row.start_date}
              : {date:row.start_date, expiry:row.expiry};
    applyRenewal(car, row.product, rec, row.partner);
    renderAll();
  }catch(e){}   // няма връзка — ще опитаме при следващо отваряне
}
let toastFreeAt = 0;
function showToast(text){
  // Няколко съобщения едно след друго, не едно върху друго
  const wait = Math.max(0, toastFreeAt - Date.now());
  toastFreeAt = Date.now() + wait + 4300;
  setTimeout(()=>{
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }, wait);
}

function checkPendingRenew(){
  const p = getPending();
  if(!p) return;
  const age = Date.now() - p.at;
  if(age > PENDING_MAX_MS){ setPending(null); return; }
  if(p.auto){ claimPostback(p); return; }   // партньорът ни праща датите сам — не питаме
  if(age < PENDING_MIN_MS || (p.snoozeUntil && Date.now() < p.snoozeUntil)) return;
  if(document.getElementById('overlay').style.display === 'flex') return;   // не прекъсваме редакция
  openPaidConfirm(p);
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkPendingRenew(); });
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
if(DEMO_MODE) document.body.insertAdjacentHTML('beforeend', `<div class="demoTag">${tr('ДЕМО','DEMO')}</div>`);

document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = {cancel:tr('Отказ','Cancel'), save:tr('Запази','Save')}[el.dataset.t]; });
applyReturnFromPartner();
renderAll();
checkPendingRenew();
loadPartners();

// PWA — позволява „Добави към началния екран“ и работа без интернет
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
