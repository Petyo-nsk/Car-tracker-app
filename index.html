<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моят автомобил — проследяване</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Моят автомобил">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1c2028; --panel2:#20242d; --line:#2b303a;
  --ink:#edeef0; --muted:#8b93a1; --amber:#e8a33d;
  --green:#4c9a6a; --green-dim:#1c3324;
  --red:#d9634f; --red-dim:#3a1f1b;
  --amberS:#e0a83d; --amberS-dim:#3a2f14;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
h1,.brand{font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:480px; margin:0 auto; padding:20px 18px 48px;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 10px var(--amber);}
.brand span{font-weight:700; font-size:17px;}
.carSwitcher{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.carPill{flex-shrink:0; background:var(--panel); border:1px solid var(--line); border-radius:100px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;}
.carPill.active{background:var(--amber); color:#1a1305; border-color:var(--amber);}
.carPill.addNew{color:var(--amber); border-style:dashed;}
.carcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:14px;}
.carcard h2{margin:0 0 3px; font-size:18px;}
.carcard .sub{font-size:12.5px; color:var(--muted);}
.summary{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:flex-start; gap:10px;}
.summary .smain{font-size:14px; font-weight:600; line-height:1.35;}
.summary .ssub{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4;}
.summary .sdot{width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:5px; background:var(--muted);}
.summary.ok{border-color:rgba(76,154,106,0.45);}
.summary.ok .sdot{background:var(--green); box-shadow:0 0 8px var(--green);}
.summary.soon{background:var(--amberS-dim); border-color:var(--amberS);}
.summary.soon .sdot{background:var(--amberS); animation:pulse 1.6s ease-in-out infinite;}
.summary.over{background:var(--red-dim); border-color:var(--red);}
.summary.over .sdot{background:var(--red); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.5); opacity:.55;}}
@media (prefers-reduced-motion: reduce){ .summary .sdot{animation:none !important;} }
.item{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
.locked{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; opacity:0.45; position:relative;}
.locked .item-title{font-weight:600; font-size:14.5px;}
.locked .item-detail{font-size:12.5px; color:var(--muted); margin-top:6px;}
.lockIcon{position:absolute; top:14px; right:16px; font-size:15px;}
.unlockCard{background:linear-gradient(135deg,#2a2210,#1c2028); border:1px solid var(--amber); border-radius:16px; padding:18px; margin:6px 0 18px; text-align:center;}
.premiumBanner{background:rgba(76,154,106,0.12); border:1px solid var(--green); border-radius:12px; padding:9px 14px; margin:0 0 14px; font-size:12.5px; color:var(--green); text-align:center;}
.unlockTitle{font-weight:700; font-size:15px; margin-bottom:3px;}
.unlockSub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
.unlockBtn{background:var(--amber); color:#1a1305; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:14.5px; cursor:pointer; width:100%;}
.promoRow{display:flex; gap:8px; margin-bottom:10px;}
.promoRow input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 10px; color:var(--ink); font-size:13px;}
.applyPromo{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:0 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
.promoMsg{font-size:12px; margin-bottom:10px; min-height:14px;}
.promoMsg.ok{color:var(--green);}
.promoMsg.bad{color:var(--red);}
.adminLink{text-align:center; margin-top:22px; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.adminPanel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px;}
.adminPanel h4{margin:0 0 12px; font-size:14px;}
.genRow{display:flex; gap:8px; margin-bottom:14px;}
.genRow input{flex:1;}
.genRow select{width:110px;}
.genBtn{background:var(--amber); color:#1a1305; font-size:12.5px; padding:0 14px; border-radius:9px; font-weight:700; cursor:pointer; border:none;}
.codeRow{display:flex; justify-content:space-between; align-items:center; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; font-size:12.5px;}
.codeRow .code{font-weight:700; letter-spacing:0.5px;}
.codeRow .meta{color:var(--muted);}
.ownerNote{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
.brokerMsg{text-align:center; font-size:12.5px; color:var(--green); margin-top:6px; min-height:14px;}
.item-top{display:flex; justify-content:space-between; align-items:center;}
.item-title{font-weight:600; font-size:14.5px;}
.status{font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px;}
.status.ok{background:var(--green-dim); color:var(--green);}
.status.soon{background:var(--amberS-dim); color:var(--amberS);}
.status.over{background:var(--red-dim); color:var(--red);}
.status.info{background:var(--panel2); color:var(--muted); border:1px solid var(--line);}
.item-detail{font-size:12.5px; color:var(--muted); margin-top:6px;}
.overlay{position:fixed; inset:0; background:rgba(10,11,14,0.6); display:none; align-items:flex-end; justify-content:center; z-index:10;}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); width:100%; max-width:480px;}
.sheet h3{margin:0 0 14px; font-size:16px;}
label{font-size:12.5px; color:var(--muted); display:block; margin:10px 0 5px;}
label:first-of-type{margin-top:0;}
input,select{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px 11px; color:var(--ink); font-size:14px; font-family:inherit;}
input:focus,select:focus{outline:none; border-color:var(--amber);}
.calcExpiry{background:var(--panel2); border:1px dashed var(--line); border-radius:9px; padding:10px 11px; font-size:14px; font-weight:600; color:var(--amber);}
.row2{display:flex; gap:10px;}
.row2>div{flex:1;}
.btnrow{display:flex; gap:10px; margin-top:16px;}
button{border:none; border-radius:10px; padding:12px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
.save{flex:1; background:var(--amber); color:#1a1305;}
.cancel{flex:1; background:var(--panel2); color:var(--ink); border:1px solid var(--line);}
.emptyState{background:var(--panel); border:1px dashed var(--line); border-radius:16px; padding:28px 20px; text-align:center;}
.emptyState .big{font-size:32px; margin-bottom:10px;}
.emptyState p{color:var(--muted); font-size:13.5px; margin:0 0 16px;}
.renewBtn{display:inline-block; margin-top:10px; background:transparent; color:var(--amber); border:1px solid var(--amber); border-radius:100px; padding:7px 14px; font-size:12.5px; font-weight:700;}
.renewBtn.hot{background:var(--amber); color:#1a1305;}
.summary .renewBtn{margin-top:8px;}
.renewText{font-size:13.5px; line-height:1.5; margin:0 0 12px;}
.renewExpiry{font-size:13px; color:var(--muted); margin:-6px 0 12px;}
.renewGo{width:100%; background:var(--amber); color:#1a1305;}
.renewNote{font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:12px;}
.renewLink{display:block; text-align:center; margin-top:12px; font-size:12.5px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.demoTag{position:fixed; top:calc(8px + env(safe-area-inset-top,0px)); right:8px; background:var(--amber); color:#1a1305; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:100px; z-index:20;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot"></div><span>Моят автомобил</span></div>

  <div class="carSwitcher" id="carSwitcher"></div>

  <div id="mainArea"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="sheetTitle">Редакция</h3>
    <div id="sheetFields"></div>
    <div class="btnrow">
      <button class="cancel" id="cancelBtn" type="button">Отказ</button>
      <button class="save" id="saveBtn" type="button">Запази</button>
    </div>
  </div>
</div>

<div class="overlay" id="renewOverlay">
  <div class="sheet">
    <h3 id="renewTitle">Поднови</h3>
    <div id="renewBody"></div>
  </div>

<script>
// Днешната дата (без час), в същия вид като датите от полетата — 'ГГГГ-ММ-ДД' в полунощ UTC,
// за да излиза точно броят на дните до изтичане.
const now = new Date();
const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
const CARS_KEY = 'car-tracker-cars-v1';
const ACTIVE_KEY = 'car-tracker-active-v1';
const DATA_PREFIX = 'car-tracker-data-';

const defs = [
  {id:'oil', title:'Смяна на масло', mode:'km', fields:['date','km','nextKm'], premium:false,
   labels:{date:'Дата',km:'Пробег при смяна (км)',nextKm:'Следваща смяна (км)'}},
  {id:'tires', title:'Смяна на гуми', mode:'date_soft', fields:['date','note'], premium:false,
   labels:{date:'Дата',note:'Бележка (напр. зимни / летни)'}},
  {id:'civil', title:'Гражданска отговорност', mode:'date_period', fields:['date','period'], premium:true,
   labels:{date:'Дата на плащане',period:'Период'}},
  {id:'vignette', title:'Винетка', mode:'vignette', fields:['vtype','date'], premium:true,
   labels:{vtype:'Вид',date:'Начало на валидност'}},
  {id:'inspection', title:'Годишен технически преглед', mode:'date', fields:['date','expiry'], premium:true,
   labels:{date:'Дата на преглед',expiry:'Изтича на'}},
  {id:'casco', title:'Каско', mode:'date', fields:['date','expiry'], premium:true,
   labels:{date:'Дата на плащане',expiry:'Изтича на'}}
];

// ==== Бутон „Поднови“ към партньор-брокер ====
// Докато няма подписан договор, RENEW_PARTNER е null и бутонът казва „скоро“.
// След договора: {name:'Име на брокера', civil:'https://...?ref=PARKBOOK', vignette:'https://...?ref=PARKBOOK'}
const RENEW_PARTNER = null;
const RENEW_LABELS = {civil:'Поднови ГО', vignette:'Купи винетка'};
const RENEW_TITLES = {civil:'Поднови гражданската', vignette:'Купи винетка'};
// Демо за срещи с брокери: отвори приложението с ?demo — показва как изглежда с партньор.
// Остава включено до затваряне на раздела.
let DEMO_MODE = false;
try{
  if(new URLSearchParams(location.search).has('demo')) sessionStorage.setItem('car-tracker-demo', '1');
  DEMO_MODE = sessionStorage.getItem('car-tracker-demo') === '1';
}catch(e){}
function renewPartner(){
  if(RENEW_PARTNER) return RENEW_PARTNER;
  if(DEMO_MODE) return {name:'Вашият брокер', demo:true};
  return null;
}

// ==== Премиум статус с реален срок на годност ====
// PREMIUM_UNTIL_KEY пази или 'paid' (платен абонамент — безсрочен, докато не се отмени),
// или ISO дата, до която важи достъпът, получен от промо код (безплатен пробен период от партньор).
const PREMIUM_UNTIL_KEY = 'car-tracker-premium-until-v1';
const MAX_CARS_PREMIUM = 10;

function todayISO(){ return today.toISOString().slice(0,10); }

function getPremiumStatus(){
  let stored;
  try{ stored = localStorage.getItem(PREMIUM_UNTIL_KEY); }catch(e){}
  if(!stored) return {active:false, permanent:false};
  if(stored === 'paid') return {active:true, permanent:true};
  const daysLeft = daysUntil(stored);
  if(daysLeft === null) return {active:false, permanent:false};
  return {active: daysLeft >= 0, permanent:false, until: stored, daysLeft};
}

// При нов промо код пазим по-дългия от двата срока (не скъсяваме съществуващ достъп).
function grantPremiumUntil(dateStr){
  let current;
  try{ current = localStorage.getItem(PREMIUM_UNTIL_KEY); }catch(e){}
  if(current === 'paid') return; // вече има платен абонамент — няма какво да удължаваме
  if(!current || new Date(dateStr) > new Date(current)){
    try{ localStorage.setItem(PREMIUM_UNTIL_KEY, dateStr); }catch(e){}
  }
}
function grantPremiumPaid(){
  try{ localStorage.setItem(PREMIUM_UNTIL_KEY, 'paid'); }catch(e){}
}

let premiumStatus = getPremiumStatus();
let isPremium = premiumStatus.active;

const TRIAL_KEY = 'car-tracker-trial-start-v1';
const TRIAL_DAYS = 30;
function trialStatus(){
  let start;
  try{ start = localStorage.getItem(TRIAL_KEY); }catch(e){}
  if(!start) return {active:false, started:false, daysLeft:0};
  const startDate = new Date(start);
  const daysPassed = Math.floor((today - startDate) / 86400000);
  const daysLeft = TRIAL_DAYS - daysPassed;
  return {active: daysLeft > 0, started:true, daysLeft: Math.max(0,daysLeft)};
}
function startTrial(){
  try{ localStorage.setItem(TRIAL_KEY, today.toISOString().slice(0,10)); }catch(e){}
}

// ==== Supabase (реална, споделена проверка на кодове — виж setup инструкциите) ====
const SUPABASE_URL = 'https://zqpomakbhmqhdeuefdfj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_TMj8xYglcKFXlCdEx-r0kg_wCxeJ45x';
const SUPABASE_CONFIGURED = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 10;

// Анонимен номер на устройството (случаен, без лични данни) — за да се брои всеки клиент
// само веднъж в статистиката на партньорските кодове, дори да въведе кода няколко пъти.
const DEVICE_ID_KEY = 'car-tracker-device-id-v1';
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem(DEVICE_ID_KEY); }catch(e){}
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    try{ localStorage.setItem(DEVICE_ID_KEY, id); }catch(e){}
  }
  return id;
}

async function redeemCodeRemote(code){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/redeem_promo_code`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify({ p_code: code, p_device: getDeviceId() })
  });
  if(!res.ok) throw new Error('network');
  return res.json(); // {valid: true, months: N} или {valid: false}
}

// Личният код на собственика вече НЕ стои тук — той живее само в базата данни (Supabase),
// точно като партньорските кодове, за да не може никой да го прочете в изходния код на страницата.
// Локалната формула по-долу е РЕЗЕРВЕН вариант (работи offline), докато Supabase не е
// настроен — кодовете, генерирани от него, НЕ са истински еднократни. След настройка на
// Supabase, реалните партньорски кодове идват от базата и минават през redeemCodeRemote.
const CODE_SALT = 'MyAuto2026Secret';
function codeChecksum(base, months){
  const s = base + '|' + months + '|' + CODE_SALT;
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h.toString(36).toUpperCase().padStart(5,'0').slice(0,5);
}
function validatePromoCodeLocal(code){
  const parts = code.split('-');
  if(parts.length < 3) return null;
  const checksumPart = parts.pop();
  const monthsPart = parts.pop();
  const base = parts.join('-');
  const m = /^(\d+)M$/.exec(monthsPart);
  if(!m) return null;
  const months = parseInt(m[1],10);
  if(codeChecksum(base, months) !== checksumPart) return null;
  return {base, months};
}

let cars = [];
let activeId = null;
try{
  const rawCars = localStorage.getItem(CARS_KEY);
  cars = rawCars ? JSON.parse(rawCars) : [{id:'car1', name:'VW Golf VII, 2016', km:142300}];
  activeId = localStorage.getItem(ACTIVE_KEY) || (cars[0] && cars[0].id);
}catch(e){ cars = []; }

function saveCars(){ try{ localStorage.setItem(CARS_KEY, JSON.stringify(cars)); }catch(e){} }
function saveActive(){ try{ localStorage.setItem(ACTIVE_KEY, activeId); }catch(e){} }

function getData(carId){
  try{
    const raw = localStorage.getItem(DATA_PREFIX+carId);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(carId==='car1'){
    return {
      oil:{date:'2026-06-12', km:'138500', nextKm:'148500'},
      civil:{date:'2026-01-15', period:'12'},
      inspection:{date:'2025-11-02', expiry:'2026-11-02'},
      casco:{date:'2026-01-15', expiry:'2027-01-15'}
    };
  }
  return {};
}
function saveData(carId, data){ try{ localStorage.setItem(DATA_PREFIX+carId, JSON.stringify(data)); }catch(e){} }

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  return Math.round((d - today) / 86400000);
}
// Показва датата по българския начин: '2026-01-15' → '15.01.2026'. Вътрешно пазим 'ГГГГ-ММ-ДД'.
function fmtDate(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (dateStr || '');
}
// ==== Винетка: видът определя колко важи. Пазим последния валиден ден (по-скоро рано, отколкото късно). ====
const VIGNETTE_TYPES = {
  day:     'Еднодневна',
  weekend: 'Уикенд',
  week:    'Седмична',
  month:   'Месечна',
  quarter: 'Тримесечна',
  year:    'Годишна'
};
function addDays(dateStr, n){
  const d = new Date(dateStr);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function vignetteExpiry(start, vtype){
  if(!start) return null;
  switch(vtype){
    case 'day':     return start;
    case 'weekend': return addDays(start, (7 - new Date(start).getUTCDay()) % 7); // до неделята включително
    case 'week':    return addDays(start, 6);
    case 'month':   return addDays(addMonths(start, 1), -1);
    case 'quarter': return addDays(start, 89);                                   // 90 дни
    default:        return addDays(addMonths(start, 12), -1);                    // годишна
  }
}
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + parseInt(months,10));
  return d.toISOString().slice(0,10);
}

function statusFor(def, data, currentKm){
  const rec = data[def.id];
  // missing — няма попълнени данни (не значи, че нещо наближава)
  // days / expiry — ползват се от лентата със статуса най-горе
  // Маслото и гумите са дневник: приложението не знае реалния пробег, затова са без цвят/срок.
  if(def.mode==='km' || def.mode==='date_soft'){
    return (rec && rec.date) ? {cls:'info', label:'Записано'} : {cls:'info', label:'Няма запис', missing:true};
  }
  if(!rec || !rec.date) return {cls:'soon', label:'Няма данни', missing:true};
  if(def.mode==='date_period'){
    if(!rec.period) return {cls:'soon', label:'Няма период', missing:true};
    const expiry = addMonths(rec.date, rec.period);
    const d = daysUntil(expiry);
    if(d<=7) return {cls:'over', label: d<0 ? 'Изтекла' : `${d} дни`, days:d, expiry};
    if(d<=15) return {cls:'soon', label:`${d} дни`, days:d, expiry};
    return {cls:'ok', label:'Валидна', days:d, expiry};
  }
  if(def.mode==='vignette'){
    const expiry = vignetteExpiry(rec.date, rec.vtype);
    const d = daysUntil(expiry);
    if(d<=7) return {cls:'over', label: d<0 ? 'Изтекла' : (d===0 ? 'Днес' : `${d} дни`), days:d, expiry};
    if(d<=15) return {cls:'soon', label:`${d} дни`, days:d, expiry};
    return {cls:'ok', label:'Валидна', days:d, expiry};
  }
  if(def.mode==='date'){
    const d = daysUntil(rec.expiry);
    if(d===null) return {cls:'soon', label:'Няма дата', missing:true};
    if(d<=7) return {cls:'over', label: d<0 ? 'Изтекъл' : `${d} дни`, days:d, expiry:rec.expiry};
    if(d<=15) return {cls:'soon', label:`${d} дни`, days:d, expiry:rec.expiry};
    return {cls:'ok', label:'Валиден', days:d, expiry:rec.expiry};
  }
  return {cls:'info', label:'Записано'};
}

// ==== Лентата със статуса най-горе — казва КАКВО наближава, а когато всичко е наред, е приятелска ====
const SHORT_NAMES = {oil:'Маслото', tires:'Гумите', civil:'Гражданската', vignette:'Винетката', inspection:'Прегледът', casco:'Каското'};
const HAPPY_LINES = [
  'Всичко е наред — карай спокойно 😎',
  'Колата ти е щастлива 💚',
  'Нищо не гори. Наслаждавай се на пътя 🛣️',
  'Документите са в ред — пали и тръгвай 🚗',
  'Чисто досие. Браво на теб 👌',
  'Спокойствие на 4 колела ✨',
  'Всичко е платено навреме 🙌'
];

function whenText(s){
  if(s.days < 0) return `изтече преди ${-s.days} ${-s.days===1 ? 'ден' : 'дни'}`;
  if(s.days === 0) return 'изтича днес';
  if(s.days === 1) return 'изтича утре';
  return `изтича след ${s.days} дни`;
}
function phrase(e){ return `${SHORT_NAMES[e.def.id] || e.def.title} ${whenText(e.s)}`; }

// Лентата следи само документите със срок. Маслото и гумите са дневник (кога и на колко км е сменено) —
// приложението не знае реалния пробег, затова не ги броим като „наближава“.
const SUMMARY_IDS = ['civil', 'vignette', 'inspection', 'casco'];

function buildSummary(defsList, data, km){
  const docs = defsList.filter(def=>SUMMARY_IDS.includes(def.id));
  if(!docs.length){
    // Безплатна версия — документите са заключени
    const happy = HAPPY_LINES[Math.floor(today / 86400000) % HAPPY_LINES.length];
    return {cls:'ok', main:happy, sub:'Следи гражданска, винетка, преглед и каско с премиум — ще ти казваме кога изтичат.'};
  }
  const entries = docs.map(def=>({def, s:statusFor(def, data, km)}));
  const tracked = entries.filter(e=>!e.s.missing && e.s.days !== undefined).sort((a,b)=>a.s.days-b.s.days);
  const over = tracked.filter(e=>e.s.cls==='over');
  const soon = tracked.filter(e=>e.s.cls==='soon');
  const missing = entries.filter(e=>e.s.missing).map(e=>SHORT_NAMES[e.def.id] || e.def.title);

  if(!tracked.length){
    return {cls:'none', main:'Кога изтичат документите ти? 👇', sub:'Въведи датите за гражданска, винетка, преглед и каско — ще ти казваме кога наближават.'};
  }
  if(over.length || soon.length){
    const urgent = [...over, ...soon];
    const icon = over.length ? '🚨' : '⏳';
    const rest = urgent.slice(1).map(phrase).join(' · ');
    return {cls: over.length ? 'over' : 'soon', main:`${icon} ${phrase(urgent[0])}`, sub: rest ? `Също: ${rest}` : 'Натисни реда отдолу, за да го обновиш.',
      renewId: RENEW_LABELS[urgent[0].def.id] ? urgent[0].def.id : null};
  }
  const next = tracked[0];
  const when = `${SHORT_NAMES[next.def.id]} на ${fmtDate(next.s.expiry)} (след ${next.s.days} дни)`;
  // Фразата се сменя всеки ден, но в рамките на деня е една и съща
  const happy = HAPPY_LINES[Math.floor(today / 86400000) % HAPPY_LINES.length];
  let sub = `Следва: ${when}`;
  if(missing.length) sub += ` · Попълни: ${missing.join(', ').toLowerCase()}`;
  return {cls:'ok', main:happy, sub};
}

function detailFor(def, data){
  const rec = data[def.id];
  if(!rec || !rec.date) return 'Няма въведени данни';
  if(def.mode==='date_period'){
    if(!rec.period) return fmtDate(rec.date);
    return `${fmtDate(rec.date)} · ${rec.period} мес. → изтича ${fmtDate(addMonths(rec.date, rec.period))}`;
  }
  if(def.mode==='vignette'){
    return `${VIGNETTE_TYPES[rec.vtype] || VIGNETTE_TYPES.year} · от ${fmtDate(rec.date)} → изтича ${fmtDate(vignetteExpiry(rec.date, rec.vtype))}`;
  }
  if(def.mode==='date') return `${fmtDate(rec.date)}${rec.expiry ? ' → изтича ' + fmtDate(rec.expiry) : ''}`;
  const fmtKm = v => v ? (parseInt(v,10)||0).toLocaleString('bg-BG') + ' км' : '';
  if(def.mode==='km'){
    const at = rec.km ? ` при ${fmtKm(rec.km)}` : '';
    const next = rec.nextKm ? ` · следваща при ${fmtKm(rec.nextKm)}` : '';
    return `Сменено на ${fmtDate(rec.date)}${at}${next}`;
  }
  return `Сменени на ${fmtDate(rec.date)}${rec.note ? ' · '+rec.note : ''}`;
}

function renderSwitcher(){
  const box = document.getElementById('carSwitcher');
  const pills = cars.map(c=>`<div class="carPill ${c.id===activeId?'active':''}" data-id="${c.id}">${c.name}</div>`).join('');
  const carLimit = isPremium ? MAX_CARS_PREMIUM : 1;
  const canAdd = cars.length < carLimit;
  const addPill = canAdd
    ? `<div class="carPill addNew" id="addCarPill">+ Кола</div>`
    : `<div class="carPill addNew" id="addCarPill" style="opacity:0.5;">🔒 + Кола</div>`;
  box.innerHTML = pills + addPill;
  box.querySelectorAll('.carPill[data-id]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeId = el.dataset.id; saveActive(); renderAll(); });
  });
  document.getElementById('addCarPill').addEventListener('click', ()=>{
    if(canAdd){ openAddCar(); }
    else {
      let note = document.getElementById('addCarNote');
      if(!note){
        note = document.createElement('div');
        note.id = 'addCarNote';
        note.style.cssText = 'font-size:12px;color:var(--muted);margin:-8px 0 14px;';
        box.parentNode.insertBefore(note, box.nextSibling);
      }
      note.textContent = isPremium
        ? `Достигнат е максимумът от ${MAX_CARS_PREMIUM} коли.`
        : 'Втора кола е достъпна само с абонамент — 9,99 €/година.';
    }
  });
}

function openAddCar(){
  document.getElementById('sheetTitle').textContent = 'Добави кола';
  document.getElementById('sheetFields').innerHTML = `
    <label>Марка и модел</label><input data-f="name" placeholder="Напр. VW Golf VII, 2016">
    <label>Текущ пробег (км)</label><input data-f="km" type="number" placeholder="142300">
  `;
  document.getElementById('overlay').style.display='flex';
  document.getElementById('overlay').dataset.editing = '__newcar';
}

function renderMain(){
  const box = document.getElementById('mainArea');
  if(!cars.length){
    box.innerHTML = `<div class="emptyState"><div class="big">🚗</div><p>Все още нямаш добавена кола.</p><button class="save" id="firstCarBtn" style="width:auto;padding:11px 20px;">Добави кола</button></div>`;
    document.getElementById('firstCarBtn').addEventListener('click', openAddCar);
    return;
  }
  const car = cars.find(c=>c.id===activeId) || cars[0];
  activeId = car.id;
  const data = getData(car.id);
  const trial = trialStatus();
  premiumStatus = getPremiumStatus();
  isPremium = premiumStatus.active;
  const fullAccess = isPremium || trial.active;
  const premiumBanner = (isPremium && !premiumStatus.permanent)
    ? `<div class="premiumBanner">Премиум достъп (от промо код) — остават ${premiumStatus.daysLeft} дни, до ${fmtDate(premiumStatus.until)}</div>`
    : '';
  const unlocked = defs.filter(d=>!d.premium || fullAccess);
  const locked = defs.filter(d=>d.premium && !fullAccess);

  const summary = buildSummary(unlocked, data, car.km);

  const itemsHtml = unlocked.map(def=>{
    const s = statusFor(def, data, car.km);
    const hot = !s.missing && (s.cls==='over' || s.cls==='soon');
    const renew = RENEW_LABELS[def.id]
      ? `<button class="renewBtn ${hot ? 'hot' : ''}" type="button" data-renew="${def.id}">${RENEW_LABELS[def.id]} →</button>` : '';
    return `<div class="item" data-id="${def.id}">
      <div class="item-top"><div class="item-title">${def.title}</div><div class="status ${s.cls}">${s.label}</div></div>
      <div class="item-detail">${detailFor(def, data)}</div>
      ${renew}
    </div>`;
  }).join('');

  const lockedHtml = locked.map(def=>`
    <div class="locked"><div class="lockIcon">🔒</div><div class="item-title">${def.title}</div><div class="item-detail">Заключено</div></div>
  `).join('');

  let unlockBlock = '';
  if(locked.length){
    if(trial.active){
      unlockBlock = `<div class="unlockCard"><div class="unlockTitle">Пробен период: ${trial.daysLeft} дни остават</div><div class="unlockSub">После 0,99 €/месец или 9,99 €/година</div></div>`;
    } else if(!trial.started){
      unlockBlock = `<div class="unlockCard"><div class="unlockTitle">1 месец безплатно</div><div class="unlockSub">Пробвай всичко за 1 кола, без карта</div>
        <button class="unlockBtn" id="trialBtn" style="margin-bottom:10px;">Започни безплатния месец</button>
        <div class="promoRow"><input id="promoInput" placeholder="Промокод (по избор)"><button class="applyPromo" id="applyPromoBtn">Приложи</button></div>
        <div class="promoMsg" id="promoMsg"></div>
        <div class="unlockSub" style="margin:10px 0 6px;">или директно абонамент</div>
        <button class="unlockBtn" id="unlockBtn">0,99 €/мес. или 9,99 €/год.</button></div>`;
    } else {
      unlockBlock = `<div class="unlockCard"><div class="unlockTitle">Пробният период изтече</div><div class="unlockSub">0,99 €/месец или 9,99 €/година</div>
        <div class="promoRow"><input id="promoInput" placeholder="Промокод (по избор)"><button class="applyPromo" id="applyPromoBtn">Приложи</button></div>
        <div class="promoMsg" id="promoMsg"></div>
        <button class="unlockBtn" id="unlockBtn">Абонирай се</button></div>`;
    }
  }

  box.innerHTML = `
    <div class="carcard"><h2>${car.name}</h2><div class="sub">Текущ пробег: ${(car.km||0).toLocaleString('bg-BG')} км</div></div>
    ${premiumBanner}
    <div class="summary ${summary.cls}"><div class="sdot"></div><div><div class="smain">${summary.main}</div><div class="ssub">${summary.sub}</div>${summary.renewId ? `<button class="renewBtn hot" type="button" data-renew="${summary.renewId}">${RENEW_LABELS[summary.renewId]} →</button>` : ''}</div></div>
    <div id="items">${itemsHtml}</div>
    <div id="lockedItems">${lockedHtml}</div>
    ${unlockBlock}
  `;

  box.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=>openSheet(el.dataset.id, car.id));
  });
  box.querySelectorAll('[data-renew]').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); openRenew(btn.dataset.renew, car.id); });
  });
  const trialBtn = document.getElementById('trialBtn');
  if(trialBtn) trialBtn.addEventListener('click', ()=>{
    startTrial();
    renderMain();
  });
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.addEventListener('click', ()=>{
    grantPremiumPaid();
    premiumStatus = getPremiumStatus();
    isPremium = premiumStatus.active;
    renderAll();
  });
  const applyPromoBtn = document.getElementById('applyPromoBtn');
  if(applyPromoBtn) applyPromoBtn.addEventListener('click', async ()=>{
    const code = (document.getElementById('promoInput').value || '').trim().toUpperCase();
    const msg = document.getElementById('promoMsg');

    applyPromoBtn.disabled = true;
    msg.className = 'promoMsg';
    msg.textContent = 'Проверка…';

    if(SUPABASE_CONFIGURED){
      try{
        const result = await redeemCodeRemote(code);
        if(result.valid){
          const until = addMonths(todayISO(), result.months);
          grantPremiumUntil(until);
          premiumStatus = getPremiumStatus();
          isPremium = premiumStatus.active;
          msg.className = 'promoMsg ok';
          msg.textContent = `Код приет — безплатно до ${fmtDate(until)}, после 0,99 €/мес. или 9,99 €/год.`;
          renderAll();
        } else {
          msg.className = 'promoMsg bad';
          msg.textContent = 'Невалиден или вече използван код';
        }
      }catch(e){
        msg.className = 'promoMsg bad';
        msg.textContent = 'Грешка при връзка — опитай пак';
      }
      applyPromoBtn.disabled = false;
      return;
    }

    // Резервен режим (Supabase още не е настроен) — работи offline, но не е еднократен
    const found = validatePromoCodeLocal(code);
    if(found){
      const until = addMonths(todayISO(), found.months);
      grantPremiumUntil(until);
      premiumStatus = getPremiumStatus();
      isPremium = premiumStatus.active;
      msg.className = 'promoMsg ok';
      msg.textContent = `Код приет — безплатно до ${fmtDate(until)}, после 0,99 €/мес. или 9,99 €/год.`;
      renderAll();
    } else {
      msg.className = 'promoMsg bad';
      msg.textContent = 'Невалиден код';
    }
    applyPromoBtn.disabled = false;
  });
}

function renderAll(){ renderSwitcher(); renderMain(); }

function openSheet(id, carId){
  const def = defs.find(d=>d.id===id);
  const data = getData(carId);
  const rec = data[id] || {};
  document.getElementById('sheetTitle').textContent = def.title;
  document.getElementById('sheetFields').innerHTML = def.fields.map(f=>{
    if(f==='period'){
      const opts = [3,6,12].map(m=>`<option value="${m}" ${String(rec.period||12)===String(m)?'selected':''}>${m} месеца</option>`).join('');
      return `<label>${def.labels[f]}</label><select data-f="period">${opts}</select>
        <label>Изтича на</label><div class="calcExpiry" id="calcExpiry">—</div>`;
    }
    if(f==='vtype'){
      const cur = rec.vtype || 'year';
      const opts = Object.entries(VIGNETTE_TYPES).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${v}</option>`).join('');
      return `<label>${def.labels[f]}</label><select data-f="vtype">${opts}</select>`;
    }
    const type = (f==='date'||f==='expiry') ? 'date' : (f==='km'||f==='nextKm') ? 'number' : 'text';
    return `<label>${def.labels[f]}</label><input data-f="${f}" type="${type}" value="${rec[f]||''}">`;
  }).join('');
  if(def.mode==='date_period'){
    // Крайната дата се смята сама от датата на плащане + избрания период
    const dateInp = document.querySelector('#sheetFields [data-f="date"]');
    const periodSel = document.querySelector('#sheetFields [data-f="period"]');
    const updateExpiry = ()=>{
      document.getElementById('calcExpiry').textContent = dateInp.value ? fmtDate(addMonths(dateInp.value, periodSel.value)) : '— (избери дата на плащане)';
    };
    dateInp.addEventListener('input', updateExpiry);
    periodSel.addEventListener('change', updateExpiry);
    updateExpiry();
  }
  if(def.mode==='vignette'){
    // Крайната дата се смята сама от вида и началото на валидност
    document.getElementById('sheetFields').insertAdjacentHTML('beforeend', `<label>Изтича на</label><div class="calcExpiry" id="calcExpiry">—</div>`);
    const dateInp = document.querySelector('#sheetFields [data-f="date"]');
    const typeSel = document.querySelector('#sheetFields [data-f="vtype"]');
    const updateExpiry = ()=>{
      document.getElementById('calcExpiry').textContent = dateInp.value ? fmtDate(vignetteExpiry(dateInp.value, typeSel.value)) : '— (избери начало на валидност)';
    };
    dateInp.addEventListener('input', updateExpiry);
    typeSel.addEventListener('change', updateExpiry);
    updateExpiry();
  }
  document.getElementById('overlay').style.display='flex';
  document.getElementById('overlay').dataset.editing = id;
  document.getElementById('overlay').dataset.carId = carId;
}

document.getElementById('cancelBtn').addEventListener('click', ()=>{ document.getElementById('overlay').style.display='none'; });
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') e.target.style.display='none'; });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const editing = document.getElementById('overlay').dataset.editing;
  const vals = {};
  document.querySelectorAll('#sheetFields input, #sheetFields select').forEach(inp=>{ vals[inp.dataset.f] = inp.value; });

  if(editing==='__newcar'){
    const id = 'car'+Date.now();
    cars.push({id, name: vals.name || 'Нова кола', km: parseInt(vals.km,10)||0});
    saveCars();
    activeId = id; saveActive();
    renderAll();
  } else {
    const carId = document.getElementById('overlay').dataset.carId;
    const data = getData(carId);
    data[editing] = vals;
    saveData(carId, data);
    renderMain();
  }
  document.getElementById('overlay').style.display='none';
});

// Анонимно броене на натисканията — нашето число за сравнение с отчета на брокера.
// В демо режим не броим, за да не се смесват срещите с истинските потребители.
function logRenewClick(product, event, partner){
  if(!SUPABASE_CONFIGURED || DEMO_MODE) return;
  fetch(`${SUPABASE_URL}/rest/v1/rpc/log_renew_click`, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
    body: JSON.stringify({ p_product: product, p_event: event, p_partner: partner ? partner.name : 'none', p_device: getDeviceId() }),
    keepalive: true
  }).catch(()=>{});
}

function openRenew(id, carId){
  const def = defs.find(d=>d.id===id);
  const s = statusFor(def, getData(carId));
  const partner = renewPartner();
  logRenewClick(id, 'open', partner);
  const what = id==='civil' ? 'гражданската' : 'винетката';
  const expiry = s.expiry ? `<div class="renewExpiry">Сегашната изтича на ${fmtDate(s.expiry)}</div>` : '';
  let body;
  if(partner){
    const product = id==='civil' ? 'гражданска отговорност' : 'винетка';
    body = `${expiry}
      <p class="renewText">Купи ${product} онлайн от <b>${escapeHtml(partner.name)}</b> — лицензиран застрахователен брокер, наш партньор. Цената е същата като директно при тях.</p>
      <button class="renewGo" type="button" id="renewGoBtn">Продължи към ${escapeHtml(partner.name)} →</button>
      <div class="renewNote" id="renewNote">Партньорска връзка. PARKBOOK не продава застраховки — само те препраща и може да получи комисиона от партньора.</div>
      <a class="renewLink" id="renewDoneLink">Вече го направих — въведи новата дата</a>
      <a class="renewLink" id="renewCloseLink">Затвори</a>`;
  } else {
    body = `${expiry}
      <p class="renewText">Скоро ще можеш да подновяваш ${what} направо оттук — с проверен партньор, на същата цена.</p>
      <button class="renewGo" type="button" id="renewCloseBtn">Добре</button>
      <a class="renewLink" id="renewDoneLink">Вече я поднових — въведи новата дата</a>`;
  }
  document.getElementById('renewTitle').textContent = RENEW_TITLES[id];
  document.getElementById('renewBody').innerHTML = body;
  const ov = document.getElementById('renewOverlay');
  const close = ()=>{ ov.style.display = 'none'; };
  ov.style.display = 'flex';
  const goBtn = document.getElementById('renewGoBtn');
  if(goBtn) goBtn.addEventListener('click', ()=>{
    if(partner.demo){
      document.getElementById('renewNote').innerHTML = '<b style="color:var(--amber);">Демо:</b> тук клиентът отива на вашия сайт с код PARKBOOK в линка, за да се отчете продажбата.';
      return;
    }
    logRenewClick(id, 'go', partner);
    window.open(partner[id], '_blank', 'noopener');
  });
  const closeBtn = document.getElementById('renewCloseBtn');
  if(closeBtn) closeBtn.addEventListener('click', close);
  const closeLink = document.getElementById('renewCloseLink');
  if(closeLink) closeLink.addEventListener('click', close);
  document.getElementById('renewDoneLink').addEventListener('click', ()=>{ close(); openSheet(id, carId); });
}
document.getElementById('renewOverlay').addEventListener('click', e=>{ if(e.target.id==='renewOverlay') e.target.style.display='none'; });
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
if(DEMO_MODE) document.body.insertAdjacentHTML('beforeend', '<div class="demoTag">ДЕМО</div>');

renderAll();

// PWA — позволява „Добави към началния екран“ и работа без интернет
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
